name: publish-forge-obsidian

# Standalone release for the neutral Obsidian interoperability package.
# The Product Forge wheel embeds the same source, but adapters must consume
# this package independently after it has been published and pinned.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "forge-obsidian version to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-forge-obsidian
  cancel-in-progress: false

jobs:
  build:
    name: Build forge-obsidian artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Version gate
        working-directory: forge-obsidian
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          actual = project["version"]
          expected = os.environ["EXPECTED_VERSION"].strip()
          if actual != expected:
              raise SystemExit(f"version mismatch: input={expected!r} package={actual!r}")
          print(f"version gate OK: forge-obsidian {actual}")
          PY
      - name: Build wheel and sdist
        working-directory: forge-obsidian
        run: python -m pip install --quiet build twine && python -m build
      - name: Twine check
        working-directory: forge-obsidian
        run: python -m twine check dist/*
      - name: Record artifact checksums
        working-directory: forge-obsidian
        run: (cd dist && sha256sum -- *) | tee dist-checksums.txt
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-obsidian-dist
          path: |
            forge-obsidian/dist/
            forge-obsidian/dist-checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish forge-obsidian to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forge-obsidian-dist
      - name: Verify artifact integrity
        run: |
          test -f forge-obsidian/dist-checksums.txt
          cd forge-obsidian && sha256sum --check dist-checksums.txt
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  verify:
    name: Verify published forge-obsidian
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Wait for package visibility
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request
          version = os.environ["EXPECTED_VERSION"]
          url = f"https://pypi.org/pypi/forge-obsidian/{version}/json"
          for attempt in range(1, 21):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if response.status == 200:
                          print(f"forge-obsidian {version} visible (attempt {attempt})")
                          break
              except Exception as exc:
                  print(f"attempt {attempt}/20: {exc}")
              time.sleep(15)
          else:
              sys.exit("forge-obsidian was not visible on PyPI after ~5 minutes")
          PY
      - name: Install and import from PyPI
        run: |
          python -m venv /tmp/forge-obsidian-verify
          /tmp/forge-obsidian-verify/bin/python -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            "forge-obsidian==${{ inputs.version }}"
          /tmp/forge-obsidian-verify/bin/python -c "import forge_obsidian; print(forge_obsidian.__file__)"
