name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/python -m ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest -q
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: |
          uv venv .venv --python 3.11
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: API regression suite
        run: .venv/bin/python -m pytest tests/ --cov=product_forge.api --cov=product_forge.analytics.engine --cov-fail-under=80 -q
      - name: Lint regression scope
        run: .venv/bin/python -m ruff check src/product_forge/api src/product_forge/jobs tests/test_contract_sweep.py tests/test_regression_methods.py tests/test_negative.py
  installed-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install test environment
        run: |
          uv venv .venv --python 3.11
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: Exercise installed wheel composition
        env:
          PRODUCT_FORGE_SYSTEM_HARNESS: "1"
        run: .venv/bin/python -m pytest tests/system/test_installed_composition.py -q -s
  bridge-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout canonical Agent Bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: EdgarSocrates98/forge-agent-bridge
          ref: main
          path: forge-agent-bridge
      - name: Verify vendored Bridge parity
        run: python scripts/check_bridge_parity.py --standalone-root forge-agent-bridge
