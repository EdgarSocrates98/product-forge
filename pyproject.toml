[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-forge"
dynamic = ["version"]
description = "Product Forge — Product Intelligence, Analytics Intelligence & Agentic Workspace for PMs and PAs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EdgarSocrates98" }]
keywords = ["product-management", "product-analytics", "agents", "forge", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.9"]
analytics = ["sqlglot>=25", "duckdb>=1.0"]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.17", "azure-monitor-query>=1.1"]
docs = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlglot>=25",
    "duckdb>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlglot>=25",
    "duckdb>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
productforge = "product_forge.cli:app"

[project.urls]
Repository = "https://github.com/EdgarSocrates98/product-forge"
Issues = "https://github.com/EdgarSocrates98/product-forge/issues"

[tool.hatch.version]
path = "src/product_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/product_forge"]

[tool.hatch.build.targets.wheel.force-include]
# Ship domain skills + agent profiles inside the wheel so `productforge
# install` can place them under each host's dirs without a repo checkout.
"skills" = "product_forge/skills"
"agents" = "product_forge/agents"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schemas", "knowledge", "docs", "skills", "agents", "rules", "factory", "README.md", "CHANGELOG.md", "LICENSE", "AGENTS.md", "CLAUDE.md", "forge.json", "forge.agentic.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]
exclude = [
    "src/product_forge/_forge_portal.py",  # vendored byte-parity — never edit
    "src/product_forge/_installkit.py",    # vendored forge installkit — never edit
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
mypy_path = "src"
packages = ["product_forge"]
